name: Build XLoOs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Repository indir
        uses: actions/checkout@v5

      - name: Gerekli araçları kur
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            unzip \
            git \
            live-build \
            debootstrap \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            qemu-user-static \
            binfmt-support

      - name: Projeyi aç
        run: |
          rm -rf xloos
          mkdir xloos
          unzip -q XLoOs-Lite-1.0.zip -d xloos

          echo "=== DOSYALAR ==="
          find xloos -maxdepth 3 -type f -print

      - name: Build dosyasını bul
        run: |
          BUILD=$(find xloos -name "build.sh" -type f | head -n 1)

          if [ -z "$BUILD" ]; then
            echo "HATA: build.sh bulunamadı!"
            exit 1
          fi

          echo "Build dosyası: $BUILD"
          chmod +x "$BUILD"

      - name: XLoOs'u derle
        run: |
          set -euxo pipefail

          BUILD=$(find xloos -name "build.sh" -type f | head -n 1)
          BUILD_DIR=$(dirname "$BUILD")

          cd "$BUILD_DIR"

          echo "=== BUILD BAŞLIYOR ==="
          echo "Klasör: $(pwd)"
          echo "=== BUILD.SH ==="

          bash -x ./build.sh

      - name: ISO'yu kontrol et
        run: |
          echo "=== ISO DOSYALARI ==="
          find . -type f -iname "*.iso" -print

          ISO_COUNT=$(find . -type f -iname "*.iso" | wc -l)

          if [ "$ISO_COUNT" -eq 0 ]; then
            echo "HATA: ISO oluşturulmadı!"
            exit 1
          fi

          echo "Bulunan ISO sayısı: $ISO_COUNT"

      - name: ISO'yu yükle
        uses: actions/upload-artifact@v6
        with:
          name: XLoOs-ISO
          path: "**/*.iso"
          if-no-files-found: error
